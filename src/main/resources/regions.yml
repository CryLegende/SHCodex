# regions.yml : régions WorldGuard à découvrir (voir config.yml pour le fonctionnement général).
#
# Chaque entrée de 'regions' a un identifiant interne unique (la clé), utilisé par les placeholders et par /codex admin :
#   worldguard-region-id   Identifiant de la région dans WorldGuard. Elle est découverte quand le joueur y entre.
#   world                  Monde de la région.
#   display-name           Nom affiché, codes & acceptés. Disponible sous la forme {region_name}.
#   item-undiscovered      Objet du menu tant que la région n'est pas découverte (material, name, lore).
#   item-discovered        Objet du menu une fois la région découverte (material, name, lore). click-action est
#                          facultatif : "COMMAND:<commande>" est lancée par le joueur qui clique sur l'objet.
#   rewards                Actions exécutées dans l'ordre à la première découverte (le nom de chaque entrée est libre).
#                          type : MESSAGE, COMMAND (lancée par la console), SOUND, TITLE ou SUBTITLE.
#                          value : le texte, la commande ou le nom du son. Avec TITLE et SUBTITLE, "titre;sous-titre"
#                          remplit les deux lignes. volume et pitch pour SOUND, fadein, stay et fadeout (en ticks)
#                          pour TITLE et SUBTITLE.
#
# Variables : {player}, {region_name} et {region_id} dans les récompenses et click-action ; {total_discovered}
# (nombre de joueurs qui l'ont découverte) et {discovery_date} dans le lore de item-discovered.
# Les entrées ci-dessous montrent les deux écritures possibles : sur plusieurs lignes, ou condensée avec des accolades.
regions:
  spawn:
    worldguard-region-id: "codex_spawn"
    world: "world"
    display-name: "&6&lSpawn"

    item-undiscovered:
      material: "BOOK"
      name: "&c???????"
      lore:
        - ''
        - '&7Vous n''avez pas encore'
        - '&7découvert cette région'
        - ''
    item-discovered:
      material: "WRITABLE_BOOK"
      name: "&6&lSpawn"
      lore:
        - "&8Découvert par: {total_discovered} joueur(s)"
        - ""
        - "&fC'est ici que les joueurs"
        - "&farrivent sur le serveur."
        - ""
        - "&7Découvert le: &e{discovery_date}"
      # click-action: "COMMAND:warp spawn {player}"

    rewards:
      title: { type: "TITLE", value: ";{region_name}", fadein: 20, stay: 60, fadeout: 20 }
      message_1: { type: "MESSAGE", value: " " }
      message_2: { type: "MESSAGE", value: "&7&l« &d&lSH &8&l» &fNouvelle région découverte: {region_name}" }
      message_3: { type: "MESSAGE", value: "&7&l« &d&lSH &8&l» &fListe des régions: &c/codex" }
      message_4: { type: "MESSAGE", value: " " }
      cmd_1: { type: "COMMAND", value: "give {player} diamond 1" }
      cmd_2: { type: "COMMAND", value: "msg {player} &bVous avez gagné un diamant !" }
      sound: { type: "SOUND", value: "BLOCK_GILDED_BLACKSTONE_STEP", volume: 1.0, pitch: 0.1 }

  grotte:
    worldguard-region-id: "codex_grotte"
    world: "world"
    display-name: "&7&lLa grotte"
    item-undiscovered: { material: "BOOK", name: "&c???????", lore: [ '', '&7Vous n''avez pas encore', '&7découvert cette région', '' ] }
    item-discovered:
      material: "WRITABLE_BOOK"
      name: "&7&lLa grotte"
      lore:
        - "&8Découvert par: {total_discovered} joueur(s)"
        - ""
        - "&fUne grotte sombre où l'on dit"
        - "&fque de vieux trésors sommeillent."
        - ""
        - "&7Retournez facilement dans"
        - "&7cette région avec &6/warp grotte"
        - ""
        - "&7Découvert le: &e{discovery_date}"
      click-action: "COMMAND:warp grotte {player}"
    rewards:
      title: { type: "TITLE", value: ";{region_name}", fadein: 20, stay: 60, fadeout: 20 }
      message_1: { type: "MESSAGE", value: "&7&l« &d&lSH &8&l» &fNouvelle région découverte: {region_name}" }
      cmd_1: { type: "COMMAND", value: "give {player} diamond 2" }
      sound: { type: "SOUND", value: "BLOCK_GILDED_BLACKSTONE_STEP", volume: 1.0, pitch: 0.1 }

  nether:
    worldguard-region-id: "codex_nether"
    world: "world_nether"
    display-name: "&c&lLe Nether"
    item-undiscovered: { material: "BOOK", name: "&c???????", lore: [ '', '&7Vous n''avez pas encore', '&7découvert cette région', '' ] }
    item-discovered:
      material: "WRITABLE_BOOK"
      name: "&c&lLe Nether"
      lore:
        - "&8Découvert par: {total_discovered} joueur(s)"
        - ""
        - "&fUn monde de feu et de lave,"
        - "&fréservé aux plus courageux."
        - ""
        - "&7Découvert le: &e{discovery_date}"
    rewards:
      title: { type: "TITLE", value: ";{region_name}", fadein: 20, stay: 60, fadeout: 20 }
      message_1: { type: "MESSAGE", value: "&7&l« &d&lSH &8&l» &fNouvelle région découverte: {region_name}" }
      cmd_1: { type: "COMMAND", value: "give {player} diamond 3" }
      sound: { type: "SOUND", value: "BLOCK_GILDED_BLACKSTONE_STEP", volume: 1.0, pitch: 0.1 }
