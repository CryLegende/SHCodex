# regions.yml
# REMARQUE IMPORTANTE: Tu devras ajouter le 'world:' pour chaque région.
# Je vais mettre "world_skyblock" comme placeholder, mais ajuste-le au nom réel de ton monde.
regions:
  # ----- Génération des récompenses globales (à répéter pour chaque région) -----
  # Ces blocs seront insérés dans la section 'rewards' de chaque région ci-dessous.
  # Pour la clarté, je ne les répète pas visuellement ici, mais imagine-les dans chaque 'rewards:'
  #
  #   rewards:
  #     # Titre global
  #     title:
  #       type: "TITLE" # ou SUBTITLE si title est vide
  #       value: ";%name%" # Laisser le titre vide, mettre la valeur dans subtitle
  #       # Si tu as besoin de TITLE et SUBTITLE séparés:
  #       # value: "TITRE_ICI;%name%"
  #       fadein: 20
  #       stay: 60
  #       fadeout: 20
  #     # Messages globaux
  #     message_1:
  #       type: "MESSAGE"
  #       value: " "
  #     message_2:
  #       type: "MESSAGE"
  #       value: "&7&l« &d&lSH &8&l» &fNouvelle région découverte: {region_name}"
  #     message_3:
  #       type: "MESSAGE"
  #       value: "&7&l« &d&lSH &8&l» &fListe des régions: &c/codex"
  #     message_4:
  #       type: "MESSAGE"
  #       value: " "
  #     # Commandes globales par découverte
  #     cmd_1:
  #       type: "COMMAND"
  #       value: "shnetworklevel exp give {player} 5"
  #     cmd_2:
  #       type: "COMMAND"
  #       value: "sm {player} &b+5 exp de network &7(/network)"
  #     # Son global
  #     sound:
  #       type: "SOUND"
  #       value: "BLOCK_GILDED_BLACKSTONE_STEP"
  #       volume: 10.0 # Attention, 10 est très fort, Minecraft utilise généralement 0.1-2.0
  #       pitch: 0.1
  #     # Commandes spécifiques à la région (viendront après les globales)
  #     # ...
  # ----- Fin des récompenses globales à insérer -----

