#NEW CODEX

  arene_pvp: # ID unique basé sur 'discovered_on_region'
    worldguard-region-id: "codex_arene"
    world: "arene"
    display-name: "&6&lArène PvP"

    item-undiscovered:
      material: "BOOK" # Par défaut, comme dans ton ancien menu
      name: "&c???????"
      lore:
        - ''
        - '&7Vous n''avez pas encore'
        - '&7découvert cette région'
        - ''
    item-discovered:
      material: "WRITABLE_BOOK" # Ou ENCHANTED_BOOK pour un look différent
      name: "&6&lArène PvP" # display-name sera utilisé via {region_name} dans le menu
      lore:
        - "&8Découvert par: {total_discovered} joueur(s)"
        - ""
        - "&fIci, combattez contre d'autres"
        - "&fjoueurs et participez aux events"
        - "&fCargaison ou KoTH (&7/events&f)."
        - ""
        - "&7Découvert le: &e{discovery_date}" # Ajout de la date
      # click-action: "COMMAND:warp pvp {player}" # Exemple si tu veux une action de TP

    rewards:
      # (Insérer les récompenses globales ici)
      title: { type: "TITLE", value: ";{region_name}", fadein: 20, stay: 60, fadeout: 20 }
      message_1: { type: "MESSAGE", value: " " }
      message_2: { type: "MESSAGE", value: "&7&l« &d&lSH &8&l» &fNouvelle région découverte: {region_name}" }
      message_3: { type: "MESSAGE", value: "&7&l« &d&lSH &8&l» &fListe des régions: &c/codex" }
      message_4: { type: "MESSAGE", value: " " }
      cmd_1: { type: "COMMAND", value: "shnetworklevel exp give {player} 10" }
      cmd_2: { type: "COMMAND", value: "sm {player} &b+10 exp de network &7(/network)" }
      sound: { type: "SOUND", value: "BLOCK_GILDED_BLACKSTONE_STEP", volume: 1.0, pitch: 0.1 } # Volume ajusté

